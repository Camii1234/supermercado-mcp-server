# Perfil "test": H2 en memoria con compatibilidad MySQL.
# Permite ejecutar las pruebas sin MySQL local y sin la variable PWD_UDEA.
spring.datasource.url=jdbc:h2:mem:supermercado_mcp;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Hibernate genera el esquema a partir de las entidades; schema.sql es exclusivo de MySQL.
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never

# Las pruebas no escriben archivo de log.
logging.file.name=

spring.application.name=supermercado-mcp-server

# ---------- Servidor MCP (sincrono, Streamable HTTP en /mcp) ----------
spring.ai.mcp.server.name=supermercado-mcp-server
spring.ai.mcp.server.version=0.0.1
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.stdio=false
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp
# Las herramientas se registran con @Tool + MethodToolCallbackProvider; no se usan anotaciones @McpTool.
spring.ai.mcp.server.annotation-scanner.enabled=false
spring.ai.mcp.server.instructions=Servidor de pedidos de supermercado a domicilio. Permite consultar productos y stock, crear pedidos en BORRADOR, agregar o retirar productos, confirmar y cancelar pedidos.

server.port=8088

# ---------- Base de datos MySQL ----------
# La contrasena se lee de la variable de entorno PWD_UDEA; nunca se escribe aqui.
spring.datasource.url=jdbc:mysql://localhost:3306/supermercado_mcp?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${PWD_UDEA}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA ----------
# El esquema lo define src/main/resources/schema.sql, que se ejecuta manualmente.
# Hibernate no crea ni altera tablas y Spring no ejecuta el script al arrancar.
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- Logging (no se registran credenciales ni datos personales) ----------
logging.file.name=./logs/supermercado-mcp-server.log
logging.level.root=INFO
logging.level.com.udea.supermercadomcp=INFO
logging.level.org.springframework.ai=INFO
